name: formreader-product
services:
  nginx:
    image: nginx:1.28.0-alpine
    pull_policy: never
    ports: ["${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8088}:8080"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./offline/web:/opt/formreader/web:ro
    depends_on: [tomcat]
    restart: unless-stopped
    networks: [web]
  tomcat:
    image: tomcat:10.1.61-jdk21-temurin
    pull_policy: never
    environment:
      FORMREADER_PUBLIC_URL: ${FORMREADER_PUBLIC_URL:?Set the external browser origin}
      FORMREADER_SETUP_TOKEN: ${FORMREADER_SETUP_TOKEN:-}
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: formreader
      DB_USER: formreader
      DB_PASSWORD: ${DB_PASSWORD:?Set database application password}
      FORMREADER_DATA_DIR: /var/lib/formreader
      TEXTSENSE_BASE_URL: ${TEXTSENSE_BASE_URL:-http://192.168.0.25:7777}
      TEXTSENSE_ENGINE_URL: ${TEXTSENSE_ENGINE_URL:-http://textsense:8080}
      TEXTSENSE_TASK_NAME: ${TEXTSENSE_TASK_NAME:-formreader-product}
      FORMREADER_INPUT_PUBLIC_URL: ${FORMREADER_INPUT_PUBLIC_URL:-}
      EPAPYRUS_INPUT_URI: ${EPAPYRUS_INPUT_URI:-file:///ePapyrus/data/input}
      EPAPYRUS_OUTPUT_URI: ${EPAPYRUS_OUTPUT_URI:-file:///ePapyrus/data/output}
      FTP_ENABLED: ${FTP_ENABLED:-false}
      FTP_BIND_ADDRESS: 0.0.0.0
      FTP_PUBLIC_HOST: ${FTP_PUBLIC_HOST:-127.0.0.1}
      FTP_PORT: ${FTP_PORT:-2121}
      FTP_PASV_MIN: ${FTP_PASV_MIN:-50000}
      FTP_PASV_MAX: ${FTP_PASV_MAX:-50020}
      JOB_TIMEOUT_MS: ${JOB_TIMEOUT_MS:-120000}
      OUTPUT_FILE_WAIT_MS: ${OUTPUT_FILE_WAIT_MS:-30000}
      TEXTSENSE_CANCEL_PATH: ${TEXTSENSE_CANCEL_PATH:-}
      CATALINA_OPTS: -Dorg.apache.tomcat.util.digester.PROPERTY_SOURCE=org.apache.tomcat.util.digester.EnvironmentPropertySource
    volumes:
      - ./offline/ROOT.war:/usr/local/tomcat/webapps/ROOT.war:ro
      - ./offline/lib/mariadb-java-client-4.0.0.jar:/usr/local/tomcat/lib/mariadb-java-client-4.0.0.jar:ro
      - ./deploy/ROOT.xml:/usr/local/tomcat/conf/Catalina/localhost/ROOT.xml:ro
      - ./deploy/server.xml:/usr/local/tomcat/conf/server.xml:ro
      - documents:/var/lib/formreader
    depends_on:
      mariadb: { condition: service_healthy }
    restart: unless-stopped
    networks: [web, database]
  mariadb:
    image: mariadb:11.4.9
    pull_policy: never
    environment:
      MARIADB_DATABASE: formreader
      MARIADB_USER: formreader
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set database application password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set a separate database administrator password}
    volumes:
      - database:/var/lib/mysql
      - ./db/V001__product.sql:/docker-entrypoint-initdb.d/001-product.sql:ro
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [database]
volumes:
  database:
  documents:
networks:
  web:
  database: { internal: true }
