worker_processes auto;
events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    # Do not log signed document URLs or setup tokens in query strings.
    log_format formreader '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /var/log/nginx/access.log formreader;
    upstream formreader_was { server tomcat:8080; keepalive 16; }
    server {
        listen 8080;
        server_name _;
        root "/opt/formreader/web";
        client_max_body_size 64m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        location /api/ {
            proxy_pass http://formreader_was;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }
        location /files/input/ {
            proxy_pass http://formreader_was;
            proxy_set_header Host $http_host;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }
        location = /_session {
            internal;
            proxy_pass http://formreader_was/api/account/me;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $http_host;
        }
        location = / { rewrite ^ /index.html last; }
        location = /index.html {
            auth_request /_session;
            error_page 401 = @login;
            add_header Cache-Control no-store;
        }
        location @login { return 302 /login; }
        location = /login { rewrite ^ /auth.html last; }
        location = /signup { rewrite ^ /auth.html last; }
        location = /setup { rewrite ^ /auth.html last; }
        location = /auth.html { add_header Cache-Control no-store; }
        location ~ ^/(css|js|vendor)/ {
            try_files $uri =404;
            # Explicit types cover PDF.js module/worker and WASM on older MIME maps.
            types { text/css css; application/javascript js mjs; application/wasm wasm; font/woff2 woff2; font/ttf ttf; }
            add_header X-Content-Type-Options nosniff;
            add_header Cache-Control "public, max-age=3600";
        }
        location / { return 404; }
    }
}
